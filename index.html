<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💖 Valentine Proposal 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 40px 50px 50px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
    }
    h1 {
      color: #ff4d6d;
      margin-bottom: 30px;
    }
    .buttons {
      position: relative;
      height: 120px;
      margin-top: 20px;
    }

    /* Heart-shaped YES button */
    #yesBtn {
      width: 110px;
      height: 100px;
      background: #ff4d6d;
      position: relative;
      transform: rotate(-45deg);
      border: none;
      cursor: pointer;
      margin-right: 40px;
    }
    #yesBtn::before,
    #yesBtn::after {
      content: "";
      width: 110px;
      height: 100px;
      background: #ff4d6d;
      border-radius: 50%;
      position: absolute;
    }
    #yesBtn::before {
      top: -55px;
      left: 0;
    }
    #yesBtn::after {
      left: 55px;
      top: 0;
    }
    #yesText {
      position: absolute;
      top: 38px;
      left: 18px;
      transform: rotate(45deg);
      color: white;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
    }

    /* NO button */
    #noBtn {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #ccc;
      position: absolute;
      right: 0;
      cursor: pointer;
    }

    #noText {
      margin-top: 15px;
      font-size: 16px;
      color: #ff4d6d;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .heart {
      position: fixed;
      font-size: 26px;
      animation: float 3s ease-out forwards;
    }
    @keyframes float {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-220px) scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💕</h1>

    <div class="buttons">
      <button id="yesBtn">
        <div id="yesText">YES 💖</div>
      </button>

      <button id="noBtn">No 🙃</button>
    </div>

    <div id="noText">thought you cudda say no 😏</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const card = document.getElementById('card');
    const noText = document.getElementById('noText');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 300 - 150;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
      noText.style.opacity = 1;
    });

    noBtn.addEventListener('mouseleave', () => {
      noText.style.opacity = 0;
    });

    yesBtn.addEventListener('click', () => {
      card.innerHTML = '<h1>Yayyy!! 💘💘💘</h1><p>You just made me the happiest person 😍</p>';
      for (let i = 0; i < 50; i++) {
        createHeart();
      }
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '❤️';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.top = window.innerHeight + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }
  </script>
</body>
</html>
