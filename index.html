<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💘</title>

<style>
  * {
    box-sizing: border-box;
    font-family: "Comic Sans MS", "Poppins", cursive;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffb6c1, #ffd6e7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
  }

  h1 {
    color: #d6004f;
    font-size: 2rem;
    margin-bottom: 30px;
  }

  .heart {
    width: 140px;
    height: 140px;
    background: pink;
    position: relative;
    transform: rotate(-45deg);
    margin: auto;
    animation: pulse 1.5s infinite;
  }

  .heart::before,
  .heart::after {
    content: "";
    width: 140px;
    height: 140px;
    background: pink;
    border-radius: 50%;
    position: absolute;
  }

  .heart::before {
    top: -70px;
    left: 0;
  }

  .heart::after {
    left: 70px;
    top: 0;
  }

  @keyframes pulse {
    0% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.1); }
    100% { transform: rotate(-45deg) scale(1); }
  }

  .buttons {
    position: relative;
    height: 220px;
    margin-top: 20px;
  }

  #yesBtn {
    position: absolute;
    top: 60px;
    left: 35px;
    width: 80px;
    height: 45px;
    border: none;
    border-radius: 25px;
    background: #ff2f6e;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 0 10px rgba(255, 47, 110, 0.6);
  }

  #noBtn {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    border: none;
    border-radius: 25px;
    background: #777;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }

  .heart-float {
    position: fixed;
    bottom: -20px;
    font-size: 24px;
    animation: floatUp 4s linear forwards;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💘</h1>

  <div class="buttons">
    <div class="heart"></div>
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 🙄</button>
  </div>
</div>

<!-- Sounds -->
<audio id="popSound" src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-up-alert-notification-2357.mp3"></audio>
<audio id="yaySound" src="https://assets.mixkit.co/sfx/preview/mixkit-happy-pop-2060.mp3"></audio>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const popSound = document.getElementById("popSound");
  const yaySound = document.getElementById("yaySound");

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("click", moveNo);

  function moveNo() {
    popSound.play();
    const x = Math.random() * 80;
    const y = Math.random() * 80;
    noBtn.style.left = x + "%";
    noBtn.style.top = y + "%";
  }

  yesBtn.addEventListener("click", () => {
    yaySound.play();
    document.body.innerHTML = "<h1 style='color:#ff2f6e;font-size:2.5rem;text-align:center;'>YAY 💖 YOU’RE MY VALENTINE 💖</h1>";

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart-float";
      heart.textContent = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (20 + Math.random() * 30) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 150);
  });
</script>

</body>
</html>
